<?xml version="1.0" encoding="UTF-8"?>
<!-- Hostile Takeover GlowIcon art: a desert tank under a radar dish.
     The AmiCradle Team's own drawing; BSD-2-Clause, like the game. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6ab8"/>
      <stop offset="1" stop-color="#a8c8f0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c47a"/>
      <stop offset="1" stop-color="#a87a30"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ab060"/>
      <stop offset="1" stop-color="#4a5a20"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8a96aa"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#sky)" stroke="#1e2a44" stroke-width="3"/>
  <path d="M8 86 Q40 74 70 82 T120 78 L120 120 L8 120 Z" fill="url(#sand)"/>
  <!-- radar tower -->
  <path d="M86 84 L92 44 L98 84 Z" fill="#6a707c" stroke="#262a33" stroke-width="2"/>
  <path d="M74 30 Q92 52 112 30 Q92 40 74 30 Z" fill="url(#dish)" stroke="#2a3040" stroke-width="2" stroke-linejoin="round"/>
  <path d="M92 38 L92 46" stroke="#2a3040" stroke-width="3"/>
  <circle cx="92" cy="22" r="3" fill="#ff4030"/>
  <!-- tank -->
  <rect x="14" y="94" width="62" height="16" rx="8" fill="#3a3a30" stroke="#1a1a12" stroke-width="2"/>
  <circle cx="24" cy="102" r="5" fill="#7a7a6a"/><circle cx="38" cy="102" r="5" fill="#7a7a6a"/>
  <circle cx="52" cy="102" r="5" fill="#7a7a6a"/><circle cx="66" cy="102" r="5" fill="#7a7a6a"/>
  <path d="M18 94 L24 82 L70 82 L74 94 Z" fill="url(#hull)" stroke="#2a3410" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 82 L36 70 L58 70 L62 82 Z" fill="url(#hull)" stroke="#2a3410" stroke-width="2" stroke-linejoin="round"/>
  <rect x="58" y="72" width="34" height="5" rx="2" fill="#4a5a20" stroke="#2a3410" stroke-width="2"/>
</svg>
